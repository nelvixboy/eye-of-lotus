name: build

on:
  push:
    branches: [main]
    # A tag is what makes a release, and without this line the workflow
    # never wakes up for one: a tag push does not match a branch filter.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: build
        run: go build ./...

  cross:
    name: cross compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: build ${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=ci-${{ github.sha }} -X github.com/nelvixboy/eye-of-lotus/internal/web.Version=ci" \
            -o /dev/null ./cmd/eye-of-lotus

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci

  # Everything above runs on every push. This one only runs for a tag, and
  # turns it into a downloadable release: a curious tester should not need a
  # Go toolchain to try the panel.
  #
  # Both architectures are built and published in this one job rather than
  # in a matrix that hands artifacts to a second job. The handover was the
  # part that broke: an explicit permissions block sets every scope it does
  # not name to none, and the second job could no longer read the artifacts
  # the first had written. There is nothing to hand over now.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: build both architectures
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X github.com/nelvixboy/eye-of-lotus/internal/web.Version=${GITHUB_REF_NAME}" \
              -o "dist/eye-of-lotus-linux-$arch" ./cmd/eye-of-lotus
            # The checksum travels beside the binary, so somebody can check
            # what they downloaded without trusting the download. It is
            # written from inside dist so that it records a bare file name:
            # a checksum naming the path it happened to be built at cannot be
            # verified anywhere else, which is the whole point of it.
            (cd dist && sha256sum "eye-of-lotus-linux-$arch" > "eye-of-lotus-linux-$arch.sha256")
          done
          ls -l dist

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Eye of Lotus ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
