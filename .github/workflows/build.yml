name: build

on:
  push:
    branches: [main]
    # A tag is what makes a release, and without this line the workflow
    # never wakes up for one: a tag push does not match a branch filter.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: build
        run: go build ./...

  cross:
    name: cross compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: build ${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=ci-${{ github.sha }} -X github.com/nelvixboy/eye-of-lotus/internal/web.Version=ci" \
            -o /dev/null ./cmd/eye-of-lotus

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci

  # Everything above runs on every push. These two only run for a tag, and
  # together they turn one into a downloadable release: a curious tester
  # should not need a Go toolchain to try the panel.
  release:
    name: release ${{ matrix.goarch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X github.com/nelvixboy/eye-of-lotus/internal/web.Version=${GITHUB_REF_NAME}" \
            -o eye-of-lotus-linux-${{ matrix.goarch }} ./cmd/eye-of-lotus
          # The checksum travels beside the binary, so somebody can check
          # what they downloaded without trusting the download.
          sha256sum eye-of-lotus-linux-${{ matrix.goarch }} \
            > eye-of-lotus-linux-${{ matrix.goarch }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: eye-of-lotus-linux-${{ matrix.goarch }}
          path: eye-of-lotus-linux-${{ matrix.goarch }}*
          if-no-files-found: error

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Eye of Lotus ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
